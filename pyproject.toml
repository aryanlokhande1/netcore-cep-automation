[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netcore-login-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "stagehand==4.4.0", "langgraph==1.2.20", "openai==3.46.0",
    "python-dotenv==1.2.4", "httpx==0.28.1", "websockets==17.4",
    "pydantic==2.14.3", "deepagents==0.7.34", "langchain-openai==1.7.4",
    "tenacity==9.1.4", "langchain==1.4.9", "langchain-core==1.7.6",
    "langsmith==0.14.17", "PyYAML==6.0.3", "tiktoken==0.14.0",
    "tzdata==2026.6",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.setuptools.packages.find]
include = ["app*", "browser*", "modules*", "learning*", "evals*", "deep_agents*"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
deep_agents = ["prompts/*.md"]
"modules.login" = ["skill/*.md", "skill/versions/*.md"]
"modules.whatsapp" = ["page1.json"]
